name: Pipeline CI e Publicacao Docker

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Verificar arquivo HTML
        run: test -f index.html

      - name: Verificar arquivo CSS
        run: test -f style.css

      - name: Verificar referencia CSS
        run: grep -q 'href="style.css"' index.html

      - name: Preparar identificacao da imagem
        run: |
          IMAGE_ID="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Construir imagem Docker
        run: docker build -t "$IMAGE_ID:ultima-alteracao" .

      - name: Autenticar no GHCR
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem no GHCR
        run: docker push "$IMAGE_ID:ultima-alteracao"
